<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('japan.jpg'); /* Set the background image */
            background-size: cover; /* Ensure the image covers the entire background */
            background-position: center; /* Center the background image */
            background-repeat: no-repeat; /* Prevent the image from repeating */
        }

        .registration-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registration-box {
            background: rgba(255, 255, 255, 0.8); /* Slight opacity for the background */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .textbox {
            margin-bottom: 20px;
        }

        .textbox input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }

        .textbox input:focus {
            border-color: #4CAF50;
        }

        .button button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .button button:hover {
            background-color: #45a049;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
        }

        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <div class="registration-box">
            
                <div class="textbox">
                    <input type="text" placeholder="Full Name" name="fullname" required>
                </div>
                  <div class="textbox">
                    <input type="text" placeholder="Birth Date " name="fullname" required>
                </div>
                    <div class="textbox">
                    <input type="text" placeholder="Cell Phone" name="fullname" required>
                </div>
                <div class="textbox">
                    <input type="email" placeholder="Email Address" name="email" required>
                </div>
                <div class="textbox">
                    <input type="password" placeholder="Password" name="password" required>
                </div>
                <div class="textbox">
                   <input type="password" placeholder="Confirm Password" name="password" required>
                </div>
                <div class="button">
                    <button type="submit">Register</button>
                </div>
                <div class="footer">
                    <p>Already have an account? <a href="index.php">Login here</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
